name: Nightly Smoke Tests

# Drives the live Systembolaget site and queries Vivino/Untappd for real. It
# fails when those sites change their markup, rate-limit the runner, or are
# simply down — which is worth knowing about, but says nothing about whether
# this repository is healthy. So it is deliberately kept off the README badge
# and off the PR path; CI (ci.yaml) is the build status. Run it by hand from
# the Actions tab after touching selectors or the matching rules.
#
# Note: GitHub disables any workflow with a `schedule:` trigger after 60 days
# without repository activity. If this stops running, re-enable it in the
# Actions tab.
#
# Note: Systembolaget geo-blocks US connections, and GitHub-hosted runners
# are in the US. While that block is in place every smoke test is skipped
# with a "redirected ... to its geo-block page" reason (see
# e2e/systembolaget.ts), so the run goes green without having driven the
# site at all — check the skip count in the report. The only ways around it
# are a self-hosted runner outside the US or waiting for the block to lift.
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Install Playwright Browsers
        run: pnpm playwright install --with-deps
      - name: Build the Chrome extension
        run: pnpm build:chrome
      - name: Build the Firefox extension
        run: pnpm build:firefox
      # Without a Firefox every Firefox test would skip and the run go green
      # having tested nothing.
      - name: Find Firefox
        run: echo "FIREFOX_PATH=$(command -v firefox)" >> "$GITHUB_ENV"
        shell: bash
      - name: Check Firefox is there
        run: test -x "$FIREFOX_PATH"
        shell: bash
      # One run for every project: Playwright's HTML reporter empties its
      # folder before writing, so a second run would delete the first one's
      # report. The Chromium tests load the extension into a headed browser
      # (extensions do not load in headless mode), hence xvfb; Firefox runs
      # headless (see e2e/firefox.spec.ts).
      - name: Run smoke tests
        run: |
          xvfb-run pnpm playwright test --project=smoke --project=live-api --project=firefox-smoke
        shell: bash
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
