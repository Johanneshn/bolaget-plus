<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="manifest.type" content="browser_action" />
    <title>Bolaget+</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="popup">
        <header class="header">
            <h1>Bolaget<span class="plus">+</span></h1>
            <button type="button" class="icon-button" id="shareButton" aria-label="Kopiera länk till tillägget" title="Kopiera länk till tillägget">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
                    <polyline points="16 6 12 2 8 6"></polyline>
                    <line x1="12" y1="2" x2="12" y2="15"></line>
                </svg>
            </button>
        </header>
        <p class="status" id="shareStatus" role="status"></p>

        <section class="settings" aria-labelledby="settingsHeading">
            <h2 id="settingsHeading">Visa betyg för</h2>
            <label class="toggle toggle-main">
                <span>Alla produkter</span>
                <input type="checkbox" role="switch" id="enabled" name="enabled">
                <span class="slider" aria-hidden="true"></span>
            </label>
            <label class="toggle">
                <span>Vin <small>Vivino</small></span>
                <input type="checkbox" role="switch" id="wine" name="wine">
                <span class="slider" aria-hidden="true"></span>
            </label>
            <label class="toggle">
                <span>Öl <small>Untappd</small></span>
                <input type="checkbox" role="switch" id="beer" name="beer">
                <span class="slider" aria-hidden="true"></span>
            </label>
            <label class="toggle">
                <span>Cider &amp; blanddryck <small>Untappd</small></span>
                <input type="checkbox" role="switch" id="cider" name="cider">
                <span class="slider" aria-hidden="true"></span>
            </label>
        </section>

        <section class="data" aria-labelledby="dataHeading">
            <h2 id="dataHeading">Sparat på den här datorn</h2>
            <div class="data-row">
                <span id="ratingsCount"></span>
                <button type="button" class="text-button" id="clearRatings">Töm</button>
            </div>
            <div class="data-row">
                <span id="pinsCount"></span>
                <button type="button" class="text-button" id="clearPins">Rensa</button>
            </div>
        </section>

        <footer class="footer">
            <span class="version"></span>
            <a href="https://github.com/BroadcastDivers/bolaget-plus/issues" target="_blank" rel="noopener noreferrer">Rapportera fel</a>
            <a href="https://u24.gov.ua/" target="_blank" rel="noopener noreferrer">Donera</a>
        </footer>
    </main>
    <script type="module" src="./main.ts"></script>
</body>
</html>
