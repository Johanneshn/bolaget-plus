name: Deploy to Stores and Create Release
description: |
  This workflow is triggered on push to the main branch.
  It checks if the version in package.json has changed, and if so, it submits the extension to the stores and creates a release.

env:
  DIRECTORY: .output
  PROJECT_NAME: bolaget-plus

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  Version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      version_changed: ${{ steps.check_version.outputs.version_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check for version change
        id: check_version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # Release when the version actually changes, not merely when
          # package.json is touched — a dependency or script edit must not
          # re-submit a version the stores already have and reject.
          #
          # Compare against the commit this push started from so a merge that
          # lands several commits at once is covered, not just its final one.
          # Falls back to HEAD~1 when that SHA is unusable (a brand-new branch
          # reports all zeroes, and a force-push can leave it unreachable).
          BASE="$BEFORE_SHA"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] ||
            ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="HEAD~1"
          fi

          PREVIOUS=$(git show "$BASE:package.json" 2>/dev/null | jq -r '.version' || true)
          CURRENT=$(jq -r '.version' package.json)

          if [ "$CURRENT" != "$PREVIOUS" ]; then
            VERSION_CHANGED=1
          else
            VERSION_CHANGED=0
          fi

          echo "Version ${PREVIOUS:-unknown} -> $CURRENT (changed=$VERSION_CHANGED)"
          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
      - name: Get version
        if: ${{ steps.check_version.outputs.version_changed == '1' }}
        id: get_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  Submit:
    needs: Version
    if: ${{ needs.Version.outputs.version_changed == '1' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build project
        run: pnpm wxt build
      - name: Zip extensions
        run: |
          pnpm run zip:chrome &&
          pnpm run zip:firefox
      - name: Submit to stores
        run: |
          pnpm wxt submit \
            --chrome-zip ${{ env.DIRECTORY }}/${{env.PROJECT_NAME}}-${{ needs.Version.outputs.version }}-chrome.zip \
            --firefox-zip ${{ env.DIRECTORY }}/${{env.PROJECT_NAME}}-${{ needs.Version.outputs.version }}-firefox.zip \
            --firefox-sources-zip ${{ env.DIRECTORY }}/${{env.PROJECT_NAME}}-${{ needs.Version.outputs.version }}-sources.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      - name: Create Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          tag_name: 'v${{ needs.Version.outputs.version }}'
          name: 'v${{ needs.Version.outputs.version }}'
          draft: false
          prerelease: false
          files: |
            ${{ env.DIRECTORY }}/${{env.PROJECT_NAME}}-${{ needs.Version.outputs.version }}-chrome.zip
            ${{ env.DIRECTORY }}/${{env.PROJECT_NAME}}-${{ needs.Version.outputs.version }}-firefox.zip
            ${{ env.DIRECTORY }}/${{env.PROJECT_NAME}}-${{ needs.Version.outputs.version }}-sources.zip
